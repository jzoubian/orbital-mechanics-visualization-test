<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Orbital Mechanics Visualization</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <h1>Orbital Mechanics Demo</h1>
    <p class="subtitle">N-body Newtonian gravity with a semi-implicit Euler integrator.</p>

    <section class="controls">
      <div id="body-list"></div>
      <button id="add-body-btn" type="button">+ Add body</button>
    </section>

    <canvas id="orbit-canvas" width="720" height="480" role="img" aria-label="Orbital simulation"></canvas>
  </main>

  <script src="script.js"></script>
</body>
</html>
